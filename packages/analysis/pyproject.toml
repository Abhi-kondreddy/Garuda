[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garuda-analyze"
version = "1.0.0"
description = "Garuda local video analysis engine"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2.1",
  "opencv-python-headless>=4.8,<5",
  "librosa>=0.10,<0.11",
  "soundfile>=0.12",
  "faster-whisper>=1.0,<2",
]

[project.scripts]
garuda-analyze = "garuda_analyze.__main__:main"

[tool.setuptools.packages.find]
include = ["garuda_analyze*"]
